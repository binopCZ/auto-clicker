<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Clicker</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header svg {
      color: var(--accent);
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .info-text {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      margin: 0;
    }

    button#open-panel {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button#open-panel:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
    }

    button#open-panel:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.2);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .brand {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
  <script src="popup.js"></script>
</head>
<body>

  <!-- Hlavička -->
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path>
      <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.41 1.41"></path>
      <path d="m17.66 17.66 1.41 1.41"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m6.34 17.66-1.41 1.41"></path>
      <path d="m19.07 4.93-1.41 1.41"></path>
    </svg>
    <h1>Auto Clicker</h1>
  </div>

  <!-- Popisek -->
  <p class="info-text">Open the control panel on this page to manage clicking.</p>

  <!-- Hlavní tlačítko (ID musí zůstat kvůli popup.js) -->
  <button id="open-panel">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <path d="M9 3v18"></path>
      <path d="m14 9 3 3-3 3"></path>
    </svg>
    Open Panel
  </button>

  <!-- Patička -->
  <div class="footer">
    <span>v1.0.0</span>
    <span>By <span class="brand">BINOP</span></span>
  </div>

</body>
</html>
